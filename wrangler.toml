name = "airdesk"
main = "build/worker.bundled.mjs"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[build]
command = "node build.mjs"

[[durable_objects.bindings]]
name = "AIRDESK_FRONTIER"
class_name = "AirDeskFrontier"

[[migrations]]
tag = "v1"
new_classes = ["AirDeskFrontier"]

[[workflows]]
name = "AIRDESK_WORKFLOW"
binding = "AIRDESK_WORKFLOW"
class_name = "AirDeskWorkflow"

[[r2_buckets]]
binding = "AIRDESK_ARTIFACTS"
bucket_name = "airdesk-artifacts"
[[routes]]
pattern = "airdesk.coey.dev"
custom_domain = true
